[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasmap-api"
version = "1.0.0"
description = "Strata API - self-hosted private geospatial layers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "geoalchemy2>=0.15,<1",
  "asyncpg>=0.29,<1",
  "psycopg2-binary>=2.9,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "email-validator>=2.1,<3",
  "python-multipart>=0.0.9,<1",
  "PyJWT[crypto]>=2.8,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=42,<46",
  "httpx>=0.27,<1",
  "redis>=5.0,<6",
  "rq>=1.16,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "geopandas>=1.0,<2",
  "pyogrio>=0.9,<1",
  "rasterio>=1.4,<2",
  "rio-tiler>=7.0,<8",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<27",
  "Pillow>=10,<14",
  "rawpy>=0.21,<1",
]

[project.optional-dependencies]
tessera = ["geotessera>=0.11,<0.12"]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.6,<1",
  "asgi-lifespan>=2.1,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a live PostGIS database (DATABASE_URL or TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]
timeout = 90

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "SIM105", "ASYNC109", "ASYNC240"]

[tool.ruff.format]
quote-style = "double"
