name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: nasmap_test
          POSTGRES_USER: nasmap
          POSTGRES_PASSWORD: nasmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nasmap -d nasmap_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://nasmap:nasmap@localhost:5432/nasmap_test
      TEST_DATABASE_URL: postgresql+asyncpg://nasmap:nasmap@localhost:5432/nasmap_test
      SECRET_KEY: ci-secret-key-not-for-production
      ENV: test
      JSON_LOGS: "false"
      RATE_LIMITING_ENABLED: "false"
      TESSERA_ENABLED: "false"
      UPLOAD_DIR: /tmp/nasmap-ci/uploads
      TESSERA_CACHE_DIR: /tmp/nasmap-ci/tessera
      TILES_DIR: /tmp/nasmap-ci/tiles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API
        run: pip install -e "./api[dev]"
      - name: Ruff format check
        run: ruff format --check api/app api/tests
      - name: Ruff lint
        run: ruff check api/app api/tests
      - name: Migrate test database
        working-directory: api
        run: python -m app.migrate
      - name: Pytest
        working-directory: api
        run: timeout 180s pytest -vv -s -x

  web:
    name: Web lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose config >/dev/null
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: nasmap-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          tags: nasmap-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
